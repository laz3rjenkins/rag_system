services:
  mariadb:
    image: mariadb:11
    container_name: rag_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "--password=${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rag_api:
    build:
      context: .
      dockerfile: Dockerfile          # CUDA-образ (nvidia/cuda:12.4.1-devel), llama-cpp-python собран с -DGGML_CUDA=on
    container_name: rag_api
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # КЛЮЧЕВОЙ ФИКС: явно отдаём GPU и, главное, capability `compute`.
      # Без compute контейнер видит nvidia-smi, но CUDA-бэкенд llama-cpp-python
      # не инициализируется -> падение при загрузке модели.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      # На проде НЕ монтируем весь исходник (`.:/app`) — это перетирало код,
      # запечённый в образ. Монтируем только то, что должно переживать пересборку.
      - ./models:/app/models
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    # Резервируем GPU через NVIDIA Container Toolkit (docker compose v2).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  mariadb_data:
